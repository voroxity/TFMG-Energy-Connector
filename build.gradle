plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.137'
    id 'idea'
    id 'org.jetbrains.kotlin.jvm' version '2.0.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "26.03"
group = "com.tfmg_energy_connector"

ext {
    tfmgCeUrl = 'https://github.com/Metallurgists-of-Create/Create-TFMG-CE/releases/download/v1.3.2a/tfmg-1.21.1-1.3.2a-community.jar'
    tfmgCeJar = file("${rootDir}/libs/tfmg-1.21.1-1.3.2a-community.jar")
}

repositories {
    flatDir {
        dirs('libs')
    }

    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }

    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    mavenCentral()
}

tasks.register('downloadTfmgCeJar') {
    outputs.file(project.ext.tfmgCeJar)
    doLast {
        def jar = project.ext.tfmgCeJar
        if (!jar.parentFile.exists()) {
            jar.parentFile.mkdirs()
        }
        if (!jar.exists() || jar.length() == 0L) {
            ant.get(src: project.ext.tfmgCeUrl, dest: jar)
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation files(project.ext.tfmgCeJar)

    implementation "curse.maven:guideme-1173950:7127444"
    implementation "curse.maven:applied-energistics-2-223794:7027323"
    implementation "curse.maven:create-328085:7408951"
    implementation "curse.maven:create-industry-693815:7430073"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "curse.maven:kotlin-for-forge-351264:6994056"
    implementation "curse.maven:jei-238222:7420587"
}

tasks.named('compileKotlin') { dependsOn 'downloadTfmgCeJar' }
tasks.named('compileJava') { dependsOn 'downloadTfmgCeJar' }
tasks.named('processResources') { dependsOn 'downloadTfmgCeJar' }

// Генерация метаданных
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
